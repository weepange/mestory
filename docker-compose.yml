services:
  # ----------------------------------------------------
  # 1. PostgreSQL Database with Persistent Data Volume
  # ----------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: mestory-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: mestory
      POSTGRES_USER: mestory
      POSTGRES_PASSWORD: mestory_secure_password_2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mestory -d mestory"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - mestory-net

  # ----------------------------------------------------
  # 2. Fastify REST API Backend
  # ----------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: mestory-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      HOST: "0.0.0.0"
      DATABASE_URL: "file:./dev.db" # Для быстрого старта с SQLite или переключения на postgresql://
      JWT_SECRET: "mestory-production-jwt-secret-key-rostov-2026"
      CORS_ORIGIN: "*"
    ports:
      - "4000:4000"
    volumes:
      - api_data:/app/apps/api/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - mestory-net

  # ----------------------------------------------------
  # 3. Next.js 14 Web Application
  # ----------------------------------------------------
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: mestory-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: "http://localhost:4000/api"
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - mestory-net

# ----------------------------------------------------
# Persistent Named Volumes (Data persists across restarts)
# ----------------------------------------------------
volumes:
  postgres_data:
    name: mestory_postgres_data
    driver: local
  api_data:
    name: mestory_api_data
    driver: local

networks:
  mestory-net:
    name: mestory_network
    driver: bridge
